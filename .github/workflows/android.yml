name: Android CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # the ubuntu runner ships a complete Android SDK, we only add the platform we build against
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          echo "using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0" || \
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0" --sdk_root="$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" | tail -3
          ls "$ANDROID_HOME/build-tools" | tail -3

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/kage-release.jks
            {
              echo "storeFile=keystore/kage-release.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > keystore/keystore.properties
            chmod 600 keystore/keystore.properties
            echo "release keystore restored"
          else
            echo "::warning::KEYSTORE_BASE64 secret is missing - the release APK stays unsigned"
          fi

      - name: Build the privileged server dex
        run: bash scripts/build-server-dex.sh

      - name: Assemble debug + release
        run: ./gradlew :manager:assembleDebug :manager:assembleRelease --no-daemon --stacktrace

      - name: Verify signing
        run: |
          APK=$(find manager/build/outputs/apk/release -name '*.apk' | head -1)
          echo "APK: $APK"
          "$ANDROID_HOME"/build-tools/34.0.0/apksigner verify --print-certs "$APK" || true

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: kage-apks
          path: |
            manager/build/outputs/apk/debug/*.apk
            manager/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Attach APKs to a tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            manager/build/outputs/apk/release/*.apk
            manager/build/outputs/apk/debug/*.apk
