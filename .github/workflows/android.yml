name: Android CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/kage-release.jks
            {
              echo "storeFile=keystore/kage-release.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > keystore/keystore.properties
            echo "release keystore restored"
          else
            echo "::warning::KEYSTORE_BASE64 secret is missing - the release APK will stay unsigned"
          fi

      - name: Build the privileged server dex
        run: bash scripts/build-server-dex.sh

      - name: Show dex info
        run: ls -la manager/src/main/assets/

      - name: Assemble debug + release
        run: ./gradlew :manager:assembleDebug :manager:assembleRelease --no-daemon --stacktrace

      - name: Verify signing
        run: |
          APK=$(find manager/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -n "$APK" ]; then
            "$ANDROID_HOME"/build-tools/34.0.0/apksigner verify --print-certs "$APK" || true
          fi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: kage-apks
          path: |
            manager/build/outputs/apk/debug/*.apk
            manager/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Attach APKs to a tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            manager/build/outputs/apk/release/*.apk
            manager/build/outputs/apk/debug/*.apk
