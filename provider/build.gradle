plugins {
    id 'com.android.library'
}

android {
    namespace 'dev.kage.provider'
    compileSdk 34

    defaultConfig {
        minSdk 26
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    api project(':common')
    compileOnly 'androidx.annotation:annotation:1.8.0'
}
